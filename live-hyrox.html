<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔴 Live · HYROX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#000;--y:#d4e000;--w:#fff;--g:#8ea2c0;--g2:#aab8d0;--green:#00e676;--red:#ff1744;--amber:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:radial-gradient(120% 80% at 50% -10%,#0a0a05 0%,#000 60%);color:var(--w);
  font-family:'Barlow Condensed',system-ui,sans-serif;min-height:100vh}

/* ══ HEADER ══ */
.hdr{display:flex;align-items:center;gap:14px;padding:16px 40px;border-bottom:1px solid #141414;position:sticky;top:0;z-index:50;background:#000}
.hdr-ico{font-size:26px;filter:drop-shadow(0 0 12px var(--y))}
.hdr-title{font-size:clamp(20px,2.4vw,32px);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:5px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:dp 1s infinite;flex-shrink:0}
.live-w{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--red);text-transform:uppercase;font-style:italic}
.dot.off{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:none}
.live-w.off{color:var(--amber)}
@keyframes dp{50%{opacity:.1;transform:scale(.7)}}
.hdr-clock{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--g);letter-spacing:2px;font-style:italic;margin:0 6px}
.gbtn{border:1px solid #333;background:transparent;color:var(--g);padding:6px 14px;border-radius:6px;font-size:11px;font-weight:900;
  font-family:inherit;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
body.geant .gbtn{border-color:var(--y);color:var(--y)}

/* ══ STAGE ══ */
.stage{padding:22px 40px;display:flex;flex-direction:column;gap:22px}
.zone-lbl{font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--g);display:flex;align-items:center;gap:9px;margin-bottom:12px}
.zone-lbl::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.zone-lbl.run::before{background:var(--y);animation:sdot 1.4s infinite}
.zone-lbl.up::before{background:var(--green)}
@keyframes sdot{50%{opacity:.05}}

/* ── 2 catégories live ── */
.lives{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lives.one{grid-template-columns:1fr;max-width:760px;margin:0 auto}
.cat{position:relative;overflow:hidden;border-radius:18px;
  background:linear-gradient(160deg,#0b0b00,#101000 60%,#0a0a00);
  border:1px solid rgba(255,255,255,.06);box-shadow:0 0 60px rgba(0,0,0,.4)}
.cat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--y));box-shadow:0 0 22px var(--c,var(--y))}
.cat-hd{display:flex;align-items:center;gap:10px;padding:15px 24px;border-bottom:1px solid #161616;background:rgba(255,255,255,.015)}
.cat-nom{font-size:clamp(16px,2vw,22px);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:2px;color:var(--c,var(--y));flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-cnt{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--g);flex-shrink:0}

.tr{display:flex;align-items:center;gap:14px;padding:13px 22px;border-bottom:1px solid #0e0e0e;position:relative}
.tr:last-child{border-bottom:none}
.tr .rk{width:30px;flex-shrink:0;text-align:center;font-size:20px;font-weight:900;font-style:italic;color:var(--g2);font-variant-numeric:tabular-nums}
.tr .who{flex:1;min-width:0}
.tr .nm{font-size:clamp(16px,1.9vw,21px);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
.tr .sub{font-size:12px;color:var(--g);font-weight:700;margin-top:2px;min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .stn{flex-shrink:0;text-align:center;width:54px}
.tr .stn b{display:block;font-size:16px;font-weight:900;color:#bbb;font-variant-numeric:tabular-nums}
.tr .stn span{font-size:9px;font-weight:800;color:var(--g);text-transform:uppercase;letter-spacing:.5px}
.tr .chr{flex-shrink:0;text-align:right;width:88px;font-size:clamp(18px,2vw,26px);font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;color:#9a9a9a}
.tr.lead{background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--y)) 12%,transparent),transparent 72%)}
.tr.lead::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--y))}
.tr.lead .rk{color:var(--c,var(--y))}
.tr.lead .nm{color:var(--w)}
.tr.lead .chr{color:var(--c,var(--y));text-shadow:0 0 22px color-mix(in srgb,var(--c,var(--y)) 40%,transparent)}
.chip{display:inline-block;background:var(--c,var(--y));color:#fff;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-left:8px;vertical-align:middle}
.warnchip{display:inline-block;background:#F59E0B22;color:#FBBF24;border:1px solid #F59E0B55;font-size:9px;font-weight:900;letter-spacing:.5px;padding:2px 6px;border-radius:3px;margin-left:8px;vertical-align:middle}
.pbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.03)}
.pbar>div{height:100%;background:var(--c,var(--y));opacity:.45}
@keyframes blink{50%{opacity:.35}}
.acts{margin-top:9px}
.now{display:inline-flex;align-items:center;gap:6px;font-size:clamp(14px,1.6vw,18px);font-weight:900;font-style:italic;padding:5px 13px;border-radius:22px;background:#F59E0B1e;color:#FBBF24;border:1px solid #F59E0B66;animation:blink 1.1s infinite;white-space:nowrap}
.strip{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.seg{min-width:38px;height:26px;padding:0 6px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;letter-spacing:.5px;background:#0e1728;border:1px solid #1e2c46;color:#5b6f8f;opacity:.55}
.seg.done{background:#00e67622;border-color:#00e67666;color:#00e676;opacity:1}
.seg.cur{background:#F59E0B26;border-color:#F59E0B;color:#FBBF24;opacity:1;animation:blink 1.1s infinite;box-shadow:0 0 14px #F59E0B55}
body.geant .now{font-size:clamp(18px,2vw,24px);padding:7px 16px}
body.geant .seg{min-width:50px;height:34px;font-size:16px}

/* ── 4 heats à venir ── */
.ups-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.he{position:relative;overflow:hidden;border-radius:12px;padding:15px 18px;background:#0a0a0a;border:1px solid #171717;border-top:3px solid var(--c,#333)}
.he-t{font-size:25px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;color:var(--w);line-height:1}
.he-cat{font-size:13px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.5px;color:#bbb;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.he-b{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px}
.he-wv{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--g);flex-shrink:0}
.he-in{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--green);white-space:nowrap}
.he.next{border-color:rgba(212,224,0,.4);background:linear-gradient(180deg,rgba(212,224,0,.06),#0a0a0a)}
.he.next .he-in,.he.next .he-t{color:var(--y)}
.he.urg{border-color:rgba(255,23,68,.5)}
.he.urg .he-in,.he.urg .he-t{color:var(--red)}

.empty{text-align:center;color:var(--g);padding:100px 40px;font-size:18px;font-style:italic;line-height:2.4}

/* ══ GÉANT ══ */
body.geant .stage{padding:30px 48px;gap:28px}
body.geant .cat-nom{font-size:clamp(22px,2.6vw,30px)}
body.geant .tr{padding:17px 26px}
body.geant .tr .nm{font-size:clamp(22px,2.4vw,30px)}
body.geant .tr .chr{font-size:clamp(24px,2.6vw,34px);width:104px}
body.geant .tr .rk{font-size:26px}
body.geant .he-t{font-size:32px}
body.geant .he-cat{font-size:16px}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-ico">⚡</div>
  <div class="hdr-title" id="evnom">HYROX</div>
  <span class="dot" id="netdot"></span><span class="live-w" id="netlabel">Live</span>
  <div class="hdr-clock" id="hdr-clock">--:--:--</div>
  <button class="gbtn" onclick="toggleGeant()" id="gbtn">📽 Écran géant</button>
</div>
<div class="stage" id="stage"><div class="empty">⏳ Connexion…</div></div>

<script>
firebase.initializeApp({databaseURL:'https://foc-2026-default-rtdb.europe-west1.firebasedatabase.app'});
var db=firebase.database(),R='hyrox/race';
var CFG=null,WAVES={},PROGRESS={},PEN={},WARN={},OFFSET=0,ADJ=0;
db.ref('.info/serverTimeOffset').on('value',function(s){OFFSET=s.val()||0;});
db.ref(R+'/clockAdj').on('value',function(s){ADJ=parseInt(s.val(),10)||0;});
db.ref(R+'/config').on('value',function(s){CFG=s.val();scheduleRender();});
db.ref(R+'/waves').on('value',function(s){WAVES=s.val()||{};scheduleRender();});
db.ref(R+'/progress').on('value',function(s){PROGRESS=s.val()||{};scheduleRender();});
db.ref(R+'/penalties').on('value',function(s){PEN=s.val()||{};scheduleRender();});
db.ref(R+'/warnings').on('value',function(s){WARN=s.val()||{};scheduleRender();});
db.ref('.info/connected').on('value',function(s){var on=s.val()===true,d=document.getElementById('netdot'),l=document.getElementById('netlabel');if(d)d.classList.toggle('off',!on);if(l){l.classList.toggle('off',!on);l.textContent=on?'Live':'Reconnexion\u2026';}});

// ===== Rendu throttl\u00e9 : coalesce les rafales Firebase (taps juges) en ~1 rendu / 250ms =====
var _rT=0,_rTimer=null;
function scheduleRender(){
  var since=Date.now()-_rT;
  if(since>=250){ _rT=Date.now(); render(); }
  else if(!_rTimer){ _rTimer=setTimeout(function(){ _rTimer=null; _rT=Date.now(); render(); }, 250-since); }
}

/* ── helpers (inchangés) ── */
function now(){return Date.now()+OFFSET+ADJ;}
function fmt(ms){if(ms==null||ms<0)return'—';var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return(h?h+':':'')+('0'+m).slice(-2)+':'+('0'+sc).slice(-2);}
function penMs(id){var e=PEN[id];if(!e)return 0;if(e.sec!=null)return Math.max(0,parseInt(e.sec,10)||0)*1000;var t=0;Object.keys(e).forEach(function(k){var v=e[k];if(v&&v.sec!=null)t+=Math.max(0,parseInt(v.sec,10)||0)*1000;});return t;}
function offMs(id,p){if(!p||p.officialMs==null)return null;var o=parseInt(p.officialMs,10);return isNaN(o)?null:Math.max(0,o)+penMs(id);}
function prog(id){return(PROGRESS&&PROGRESS[id])||{};}
function nSt(){return((CFG&&CFG.stations)||[]).filter(function(s){return s.seg==='station';}).length;}
function doneCount(id){var p=prog(id);return p.stations?Object.values(p.stations).filter(function(x){return x&&x.done&&!x.auto;}).length:0;}
function warnCount(id){var w=WARN[id];return w?Object.keys(w).length:0;}
var _csCache={};
function courseStateC(id){ if(_csCache[id])return _csCache[id]; return (_csCache[id]=courseState(id)); }
function _num(v){return Math.round(parseFloat(v)||0);}
var RUNNER='<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" style="vertical-align:-2px"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>';
function stCode(nom){var n=(nom||'').toLowerCase();if(/ski/.test(n))return 'SKI';if(/sled push/.test(n))return 'PSH';if(/sled pull/.test(n))return 'PLL';if(/burpee/.test(n))return 'BUR';if(/row|rameur/.test(n))return 'ROW';if(/farmer/.test(n))return 'FAR';if(/sandbag|lunge|fente/.test(n))return 'LUN';if(/wall/.test(n))return 'WB';return '\u2022';}
function WAVEcat(id){var w=Object.values(WAVES).find(function(w){return(w.athletes||[]).some(function(a){return a.id===id;});});return w?w.catId:null;}

function courseState(id){
  var segs=((CFG&&CFG.stations)||[]).filter(function(s){return s.seg==='station'||s.seg==='run';});
  var p=prog(id),pst=(p&&p.stations)||{};
  var out=[],runActive=false,repNow=null,stIdx=0;
  for(var k=0;k<segs.length;k++){
    var s=segs[k],rec=pst[s.idx],done=!!(rec&&rec.done);
    if(s.seg==='station'){stIdx++;out.push({type:'station',num:stIdx,done:done,idx:s.idx,nom:s.nom});}
    else out.push({type:'run',done:done,idx:s.idx});
  }
  var curPos=-1;
  for(var i=0;i<out.length;i++){if(!out[i].done){curPos=i;break;}}
  if(curPos>=0){var seg=out[curPos];if(seg.type==='run')runActive=true;else seg.current=true;}
  for(var j=0;j<out.length;j++){
    if(out[j].type!=='station'||out[j].done)continue;
    var rec2=pst[out[j].idx];
    if(rec2&&rec2.val!=null&&!rec2.done){
      var sdef=((CFG&&CFG.stations)||[]).find(function(x){return x.idx===out[j].idx;});
      var target=null;
      if(sdef){var q=(sdef.qtyParCat&&WAVEcat(id)!=null&&sdef.qtyParCat[String(WAVEcat(id))]!=null)?sdef.qtyParCat[String(WAVEcat(id))]:sdef.qty;target=parseFloat(q)||null;}
      if(!repNow||(parseFloat(rec2.val)||0)>0){repNow={val:rec2.val,target:target,nom:out[j].nom};break;}
    }
  }
  return{segs:out,runActive:runActive,repNow:repNow};
}
function advScore(id){
  var cs=courseStateC(id);
  return doneCount(id)*1e9+(cs.runActive?5e8:0)+(cs.repNow?parseFloat(cs.repNow.val)||0:0);
}
function getSchedAt(w){
  if(w.schedAt)return w.schedAt;
  if(!w.time)return null;
  var p=w.time.split(':');if(p.length<2)return null;
  var d=new Date();d.setHours(parseInt(p[0],10)||0,parseInt(p[1],10)||0,0,0);
  return d.getTime();
}

/* ── formatage présentation ── */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function clockOf(ts){var d=new Date(ts);return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function cdText(remain){
  if(remain<=0)return'départ imminent';
  if(remain<600000){var s=Math.ceil(remain/1000),m=Math.floor(s/60),sc=s%60;return('0'+m).slice(-2)+':'+('0'+sc).slice(-2);}
  if(remain<3600000)return'dans '+Math.round(remain/60000)+' min';
  var h=Math.floor(remain/3600000),mm=Math.round((remain%3600000)/60000);return'dans '+h+'h'+('0'+mm).slice(-2);
}

/* ── RENDER ── */
function render(){
  var stage=document.getElementById('stage');if(!stage)return;
  _csCache={};
  if(!CFG){stage.innerHTML='<div class="empty">⏳ En attente de la config…</div>';return;}
  var ev=document.getElementById('evnom');if(ev)ev.textContent=CFG.nom||'HYROX';
  var totSt=nSt();

  // ── équipes en course, par catégorie ──
  var byDiv={};
  Object.values(WAVES).forEach(function(w){
    if(!w.startAt)return;
    var k=w.catId;
    if(!byDiv[k])byDiv[k]={nom:w.catNom||'',couleur:w.couleur||'#D4E000',running:[]};
    (w.athletes||[]).forEach(function(a){
      var p=prog(a.id);
      if(p&&p.finishedAt)return; // arrivés : non affichés dans cette vue
      byDiv[k].running.push({id:a.id,nom:a.nom||'',club:a.club||'',waveNum:w.num,startAt:w.startAt});
    });
  });
  var divs=Object.keys(byDiv).map(function(k){return byDiv[k];}).filter(function(d){return d.running.length;});
  divs.forEach(function(d){
    d.running.forEach(function(t){t._adv=advScore(t.id);});
    d.running.sort(function(a,b){return b._adv-a._adv||a.waveNum-b.waveNum;});
    d._ls=d.running[0].startAt;d._la=d.running[0]._adv;
  });
  divs.sort(function(a,b){return b._la-a._la;});         // N catégories (réglable) dont le leader est le + avancé
  var _N=Math.max(1,Math.min(6,(CFG&&parseInt(CFG.liveMaxCat,10))||2));
  var shown=divs.slice(0,_N);

  // ── prochains départs ──
  var pending=[];
  Object.values(WAVES).forEach(function(w){
    if(w.startAt)return;var s=getSchedAt(w);if(!s)return;
    pending.push({catNom:w.catNom||'',couleur:w.couleur||'#D4E000',waveNum:w.num||'',sched:s});
  });
  pending.sort(function(a,b){return a.sched-b.sched;});
  pending=pending.slice(0,4);

  if(!shown.length&&!pending.length){
    stage.innerHTML='<div class="empty">⏳ Aucune vague lancée.<br>Les équipes apparaîtront ici au départ.</div>';
    return;
  }

  var html='';
  if(shown.length){
    html+='<div><div class="zone-lbl run">En course</div><div class="lives'+(shown.length===1?' one':'')+'">';
    shown.forEach(function(d){
      html+='<div class="cat" style="--c:'+d.couleur+'">'
        +'<div class="cat-hd"><div class="cat-nom">'+esc(d.nom)+'</div><div class="cat-cnt">'+d.running.length+' en course</div></div>';
      d.running.forEach(function(t,ri){
        var rank=ri+1,isLead=rank===1;
        var done=doneCount(t.id),pct=totSt?Math.round(done/totSt*100):0;
        var sub=t.club?esc(t.club):'';
        if(!isLead){var my=now()-t.startAt,ld=now()-d._ls,l=Math.max(0,my-ld);if(l>2000)sub+=(sub?' · ':'')+'+'+fmt(l);}
        var cs=courseStateC(t.id);
        var nowHtml='';
        if(cs.runActive){ nowHtml='<span class="now">'+RUNNER+' Course</span>'; }
        else { var curSeg=null,_k; for(_k=0;_k<cs.segs.length;_k++){ if(cs.segs[_k].type==='station'&&cs.segs[_k].current){curSeg=cs.segs[_k];break;} }
          if(curSeg){ var rp=cs.repNow, rtxt=''; if(rp&&rp.val!=null){ rtxt=' \u00b7 '+_num(rp.val)+(rp.target?'/'+_num(rp.target):''); }
            nowHtml='<span class="now">'+esc(curSeg.nom)+rtxt+'</span>'; } }
        var strip='<div class="strip">'+cs.segs.filter(function(s){return s.type==='station';}).map(function(s){
          var cls=s.done?'done':(s.current?'cur':''); return '<span class="seg '+cls+'">'+stCode(s.nom)+'</span>'; }).join('')+'</div>';
        html+='<div class="tr'+(isLead?' lead':'')+'">'
          +'<div class="rk">'+rank+'</div>'
          +'<div class="who">'
            +'<div class="nm">'+esc(t.nom)+(isLead?'<span class="chip">\u26a1 Leader</span>':'')+(warnCount(t.id)?'<span class="warnchip">\u26a0\u00d7'+warnCount(t.id)+'</span>':'')+'</div>'
            +(sub?'<div class="sub">'+sub+'</div>':'')
            +(nowHtml?'<div class="acts">'+nowHtml+'</div>':'')
            +strip
          +'</div>'
          +'<div class="chr" data-start="'+t.startAt+'">'+fmt(now()-t.startAt)+'</div>'
        +'</div>';
      });
      html+='</div>';
    });
    html+='</div></div>';
  }
  if(pending.length){
    html+='<div><div class="zone-lbl up">Prochains départs</div><div class="ups-grid">';
    pending.forEach(function(p,i){
      var remain=p.sched-now(),urg=remain>0&&remain<180000;
      html+='<div class="he'+(i===0?' next':'')+(urg?' urg':'')+'" style="--c:'+p.couleur+'" data-sched="'+p.sched+'">'
        +'<div class="he-t">'+clockOf(p.sched)+'</div>'
        +'<div class="he-cat">'+esc(p.catNom)+'</div>'
        +'<div class="he-b"><span class="he-wv">Vague '+p.waveNum+'</span><span class="he-in">'+cdText(remain)+'</span></div>'
      +'</div>';
    });
    html+='</div></div>';
  }
  stage.innerHTML=html;
}

/* ── tick : horloge + chronos + countdowns ── */
setInterval(function(){
  var d=new Date(now()),el=document.getElementById('hdr-clock');
  if(el)el.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
  document.querySelectorAll('.chr[data-start]').forEach(function(n){n.textContent=fmt(now()-parseInt(n.dataset.start,10));});
  var rr=false;
  document.querySelectorAll('.he[data-sched]').forEach(function(b){
    var s=parseInt(b.dataset.sched,10),r=s-now(),el=b.querySelector('.he-in');
    if(r<=0){rr=true;}
    else{if(el)el.textContent=cdText(r);if(r<180000)b.classList.add('urg');}
  });
  if(rr)scheduleRender();
},500);

/* ── Écran géant : plein écran natif (rétroprojecteur) + agrandissement ── */
function _fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function _enterFS(){var e=document.documentElement,fn=e.requestFullscreen||e.webkitRequestFullscreen;if(fn){try{var r=fn.call(e);if(r&&r.catch)r.catch(function(){});}catch(err){}}}
function _exitFS(){var fn=document.exitFullscreen||document.webkitExitFullscreen;if(fn&&_fsEl()){try{fn.call(document);}catch(err){}}}
function _setGeant(on){
  document.body.classList.toggle('geant',on);
  var b=document.getElementById('gbtn');if(b)b.textContent=on?'✕ Quitter':'📽 Écran géant';
}
function toggleGeant(){
  var on=!document.body.classList.contains('geant');
  _setGeant(on);
  if(on)_enterFS();else _exitFS();
}
// Échap sort du plein écran → on retire aussi l'agrandissement pour rester cohérent
document.addEventListener('fullscreenchange',function(){if(!_fsEl())_setGeant(false);});
document.addEventListener('webkitfullscreenchange',function(){if(!_fsEl())_setGeant(false);});
(function(){
  if('wakeLock' in navigator){function wl(){navigator.wakeLock.request('screen').catch(function(){});}wl();document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wl();});}
})();
</script>
<script>if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}</script>
